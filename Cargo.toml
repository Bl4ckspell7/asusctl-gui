[package]
name = "asusctl-gui"
version = "0.2.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11.4", features = ["v4_22"] }
libadwaita = { version = "0.9.2", features = ["v1_9"] }
log = "0.4.33"
env_logger = "0.11.11"

[build-dependencies]
glib-build-tools = "0.22.8"

[profile.release]
strip = true
lto = "thin"
