[package]
name = "asusctl-gui"
version = "0.4.3"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_24"] }
libadwaita = { version = "0.9.2", features = ["v1_10"] }
log = "0.4.34"
env_logger = "0.11.11"

[build-dependencies]
glib-build-tools = "0.22.8"

[profile.release]
strip = true
lto = "thin"
