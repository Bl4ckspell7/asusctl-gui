name: renovate

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run mode"
        required: false
        default: "false"
        type: choice
        options: ["false", "null", "full"]
      logLevel:
        description: "Log level"
        required: false
        default: "info"
        type: choice
        options: [debug, info, warn, error]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: 44.158.1@sha256:c64e6ca95349166fc4d3823e29c89417bb2f78f1f2f043449f798e69af3a1f33
        env:
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/regen-cargo-sources\\.sh$"]'
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'false' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
