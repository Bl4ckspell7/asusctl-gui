name: Update cargo-sources.json

permissions:
    contents: write

on:
    pull_request_target:
        paths:
            - "Cargo.lock"

jobs:
    update-cargo-sources:
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  ref: ${{ github.head_ref }}

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

            - name: Install flatpak-cargo-generator
              run: uv tool install flatpak-cargo-generator

            - name: Refresh transitive deps for bumped crates
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  bumped=$(git diff "$BASE_SHA" HEAD -- Cargo.lock \
                      | grep -E '^\+name = "' \
                      | sed -E 's/.*"([^"]+)".*/\1/' \
                      | sort -u)
                  [ -z "$bumped" ] && exit 0
                  args=""
                  for c in $bumped; do args="$args -p $c"; done
                  cargo update --recursive $args

            - name: Regenerate cargo-sources.json
              run: flatpak-cargo-generator Cargo.lock -o cargo-sources.json

            - name: Commit and push if changed
              run: |
                  git diff --quiet Cargo.lock cargo-sources.json && exit 0
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Cargo.lock cargo-sources.json
                  git commit -m "fix: refresh Cargo.lock and cargo-sources.json"
                  git push
