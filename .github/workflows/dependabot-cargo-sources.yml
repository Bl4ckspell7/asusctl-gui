name: Update cargo-sources.json

permissions:
    contents: write

on:
    pull_request:
        paths:
            - "Cargo.lock"

jobs:
    update-cargo-sources:
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.head_ref }}
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

            - name: Install flatpak-cargo-generator
              run: uv tool install flatpak-cargo-generator

            - name: Regenerate cargo-sources.json
              run: flatpak-cargo-generator Cargo.lock -o cargo-sources.json

            - name: Commit and push if changed
              run: |
                  git diff --quiet cargo-sources.json && exit 0
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add cargo-sources.json
                  git commit -m "fix: regenerate cargo-sources.json for updated Cargo.lock"
                  git push
