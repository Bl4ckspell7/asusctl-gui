name: Flatpak

permissions:
    contents: read

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    flatpak:
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:9b485ec99dd7a32966475e88e23add82e74162987e662dd0dcaaf26cdbb3de20
            options: --privileged

        steps:
            - name: Checkout repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                persist-credentials: false

            - name: Build Flatpak
              uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
              with:
                  manifest-path: com.github.bl4ckspell7.asusctl-gui.yml
                  bundle: asusctl-gui.flatpak
                  branch: stable
                  upload-artifact: true

            # Advisory only: these still flag the known sandbox hole
            # (--talk-name=org.freedesktop.Flatpak) and the missing AppStream
            # screenshots. Make them blocking once both are addressed.
            - name: Lint Flatpak manifest
              continue-on-error: true
              run: flatpak-builder-lint manifest com.github.bl4ckspell7.asusctl-gui.yml

            - name: Lint Flatpak repo
              continue-on-error: true
              run: flatpak-builder-lint repo repo
