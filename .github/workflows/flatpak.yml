name: Flatpak

permissions:
    contents: read

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    flatpak:
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
            options: --privileged

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Build Flatpak
              uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
              with:
                  manifest-path: com.github.bl4ckspell7.asusctl-gui.yml
                  bundle: asusctl-gui.flatpak
                  branch: stable
                  upload-artifact: true

            # Advisory only: these still flag the known sandbox hole
            # (--talk-name=org.freedesktop.Flatpak) and the missing AppStream
            # screenshots. Make them blocking once both are addressed.
            - name: Lint Flatpak manifest
              continue-on-error: true
              run: flatpak-builder-lint manifest com.github.bl4ckspell7.asusctl-gui.yml

            - name: Lint Flatpak repo
              continue-on-error: true
              run: flatpak-builder-lint repo repo
